<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Հարցման արդյունքներ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page wide">
    <header class="page-header">
      <span class="logo-chip"><img src="assets/ameriabank-logo.png" alt="Ameriabank" class="brand-logo" /></span>
      <h1>Հարցման արդյունքներ</h1>
      <p>Ներքին տեղեկատվական հարթակի հետազոտական հարցման բոլոր պատասխանները։</p>
    </header>

    <form id="login-form" class="panel login-panel" hidden>
      <label class="field-label" for="passcode">Մուտքի կոդ</label>
      <input type="password" id="passcode" autocomplete="current-password" required />
      <button type="submit" class="primary" id="login-btn">Մուտք</button>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
    </form>

    <div id="dashboard-content" hidden>
    <div id="summary-panel" class="panel summary-panel" hidden></div>

    <div id="stats-row" class="stats-row"></div>

    <div class="toolbar">
      <div class="toolbar-group">
        <button id="analyze-btn" class="primary">Վերլուծել բաց պատասխանները</button>
        <button id="refresh-btn" class="secondary">Թարմացնել</button>
      </div>
      <div class="toolbar-group">
        <select id="location-filter" aria-label="Ֆիլտրել ըստ աշխատավայրի">
          <option value="">Բոլոր աշխատավայրերը</option>
          <option value="Մասնաճյուղում">Մասնաճյուղում</option>
          <option value="Կոնտակտային կենտրոնում">Կոնտակտային կենտրոնում</option>
        </select>
        <select id="role-filter" aria-label="Ֆիլտրել ըստ պաշտոնի">
          <option value="">Բոլոր պաշտոնները</option>
          <option value="Հաճախորդի մենեջեր">Հաճախորդի մենեջեր</option>
          <option value="Թվային խորհրդատու">Թվային խորհրդատու</option>
          <option value="Մասնագետ-գանձապահ">Մասնագետ-գանձապահ</option>
          <option value="Վարկային մասնագետ">Վարկային մասնագետ</option>
          <option value="Սպասարկման բաժնի ղեկավար">Սպասարկման բաժնի ղեկավար</option>
          <option value="Մասնաճյուղի կառավարիչ">Մասնաճյուղի կառավարիչ</option>
          <option value="Սպասարկման մասնագետ">Սպասարկման մասնագետ</option>
          <option value="Թիմի ղեկավար">Թիմի ղեկավար</option>
          <option value="ԿԿ ղեկավար">ԿԿ ղեկավար</option>
        </select>
        <button id="export-csv-btn" class="secondary">Արտահանել CSV</button>
        <button id="clear-btn" class="secondary danger">Ջնջել բոլոր պատասխանները</button>
      </div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="question-groups" class="question-groups"></div>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
