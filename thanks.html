<!DOCTYPE html>
<html lang="hy">
<head>

  <title>Շնորհակալություն</title>
  <link rel="stylesheet" href="style.css" />

<body>
  <main class="page">
    <header class="page-header">
      <span class="logo-chip"><img src="assets/ameriabank-logo.png" alt="Ameriabank" class="brand-logo" /></span>
      <h1>Շնորհակալություն</h1>
    </header>

    <div class="panel">
      <p class="thanks-lead">Ձեր պատասխանները հաջողությամբ ուղարկվեցին։</p>
      <p class="thanks-body">
        Ձեր կարծիքը կօգնի մեզ հասկանալ, թե որ տեղեկատվությունից սկսել ներքին
        հարթակի ստեղծումը։ Այժմ կարող եք փակել այս էջը։
      </p>
    </div>
